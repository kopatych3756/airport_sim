# Variant 31: runway management. Default demonstrative scenario.
SEED 31
MAX_TICKS 120
DELAY_MS 0
EMERGENCY_FUEL_TICKS 3
PRIORITY_WEIGHTS 10 65 25
ARRIVAL_FUEL 9 22
ARRIVAL_BURN 1 2

# RUNWAY <id> <length_m> <safety_interval_ticks>
RUNWAY RWY-A 3400 2
RUNWAY RWY-B 2500 1
RUNWAY RWY-C 1900 1

# TYPE <name> <required_length_m> <landing_duration> <takeoff_duration>
TYPE E190 1500 2 2
TYPE A320 1800 3 3
TYPE B738 2000 3 3
TYPE A330 2700 4 4
TYPE B77W 3100 5 5

# Planned closure windows are half-open: [start, end).
# If a runway is already busy at closure start, that operation is never interrupted.
CLOSE RWY-A 28 38
CLOSE RWY-C 52 60

# FLOW <ARRIVAL|DEPARTURE> <count> <first_tick> <min_interval> <max_interval>
FLOW ARRIVAL 16 0 1 4
FLOW DEPARTURE 14 0 1 5
